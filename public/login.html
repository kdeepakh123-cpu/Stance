<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · STANCE</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f3fb}.auth-card{width:min(420px,92vw);padding:34px;background:white;border:1px solid #e7e4f5;border-radius:18px;box-shadow:0 20px 60px #25205b18}.auth-card h1{margin:14px 0 6px}.auth-card p{color:#68708a;font-size:13px;line-height:1.6}.auth-card input{width:100%;padding:13px;border:1px solid #ddd9ed;border-radius:9px;margin:8px 0}.auth-card button{width:100%;margin-top:10px}.auth-msg{font-size:12px;min-height:20px;color:#6654d9}</style></head><body><main class="auth-card"><div class="brand"><span class="brand-mark">S</span><span>STANCE</span></div><h1 id="heading">Welcome to STANCE</h1><p id="sub">Sign in with your email. We'll send you a one-time code. No password needed.</p><form id="form"><input id="email" type="email" placeholder="Your email address" autocomplete="username webauthn" required><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden><button class="btn btn-primary" id="submit">Send sign-in code</button><button class="btn btn-outline" id="back" type="button" hidden>Use another email</button></form><p class="auth-msg" id="msg" role="status"></p><p>Your profile is private by default. You choose whether to appear in teammate discovery.</p></main><script>
const A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),msg=document.getElementById('msg'),submit=document.getElementById('submit');let step=0;
if(!A){msg.textContent='Sign-in is temporarily unavailable. Refresh and try again.';submit.disabled=true;}
A&&A.getSession().then(s=>{if(s&&s.user)location.replace('/')});
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{if(!step){await A.startLogin({email:email.value.trim()});step=1;code.hidden=false;document.getElementById('back').hidden=false;submit.textContent='Verify and sign in';msg.textContent='A one-time code has been sent to your email.';code.focus();}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});location.replace('/');}}catch(err){msg.textContent=err.message||'Unable to sign in. Please try again.';}finally{submit.disabled=false;}});
document.getElementById('back').onclick=()=>{step=0;code.hidden=true;document.getElementById('back').hidden=true;submit.textContent='Send sign-in code';msg.textContent='';};
</script></body></html>
